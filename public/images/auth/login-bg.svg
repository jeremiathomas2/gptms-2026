<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background circles representing groups -->
  <circle cx="100" cy="100" r="80" fill="url(#grad1)" opacity="0.6"/>
  <circle cx="700" cy="150" r="60" fill="url(#grad2)" opacity="0.5"/>
  <circle cx="200" cy="500" r="100" fill="url(#grad1)" opacity="0.4"/>
  <circle cx="650" cy="450" r="70" fill="url(#grad2)" opacity="0.5"/>
  
  <!-- Connecting lines representing collaboration -->
  <line x1="100" y1="100" x2="200" y2="500" stroke="#667eea" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  <line x1="700" y1="150" x2="650" y2="450" stroke="#764ba2" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  <line x1="200" y1="500" x2="650" y2="450" stroke="#f093fb" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  
  <!-- Small dots representing users -->
  <circle cx="100" cy="100" r="8" fill="#667eea" opacity="0.8"/>
  <circle cx="700" cy="150" r="6" fill="#764ba2" opacity="0.8"/>
  <circle cx="200" cy="500" r="10" fill="#f093fb" opacity="0.8"/>
  <circle cx="650" cy="450" r="7" fill="#f5576c" opacity="0.8"/>
  
  <!-- Project management symbols -->
  <g transform="translate(400, 300)" opacity="0.1">
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#667eea" stroke-width="2" rx="8"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#667eea" stroke-width="2"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#667eea" stroke-width="2"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#667eea" stroke-width="2"/>
    <circle cx="-15" cy="-20" r="3" fill="#667eea"/>
    <circle cx="0" cy="0" r="3" fill="#764ba2"/>
    <circle cx="15" cy="20" r="3" fill="#f093fb"/>
  </g>
  
  <!-- Abstract shapes representing workflow -->
  <path d="M 50 300 Q 150 250 250 300 T 450 300" fill="none" stroke="#667eea" stroke-width="1" opacity="0.1"/>
  <path d="M 350 200 Q 450 150 550 200 T 750 200" fill="none" stroke="#764ba2" stroke-width="1" opacity="0.1"/>
</svg>
