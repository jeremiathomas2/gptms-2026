<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background hexagons representing teams -->
  <g transform="translate(150, 100)" opacity="0.3">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#grad1)" stroke="#9333ea" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#9333ea"/>
  </g>
  
  <g transform="translate(650, 150)" opacity="0.25">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#grad2)" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#3b82f6"/>
  </g>
  
  <g transform="translate(200, 450)" opacity="0.35">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#grad1)" stroke="#10b981" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
  </g>
  
  <!-- Network connections -->
  <line x1="150" y1="100" x2="650" y2="150" stroke="#9333ea" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="650" y1="150" x2="200" y2="450" stroke="#3b82f6" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  <line x1="200" y1="450" x2="150" y2="100" stroke="#10b981" stroke-width="1" opacity="0.2" stroke-dasharray="3,3"/>
  
  <!-- User avatars representation -->
  <g transform="translate(100, 250)" opacity="0.2">
    <circle cx="0" cy="0" r="15" fill="#9333ea"/>
    <path d="M -8 8 Q 0 5 8 8" fill="#9333ea"/>
  </g>
  
  <g transform="translate(300, 200)" opacity="0.2">
    <circle cx="0" cy="0" r="12" fill="#3b82f6"/>
    <path d="M -6 6 Q 0 4 6 6" fill="#3b82f6"/>
  </g>
  
  <g transform="translate(500, 350)" opacity="0.2">
    <circle cx="0" cy="0" r="14" fill="#10b981"/>
    <path d="M -7 7 Q 0 5 7 7" fill="#10b981"/>
  </g>
  
  <g transform="translate(700, 300)" opacity="0.2">
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <path d="M -5 5 Q 0 3 5 5" fill="#f59e0b"/>
  </g>
  
  <!-- Project cards representation -->
  <g transform="translate(400, 300)" opacity="0.1">
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#9333ea" stroke-width="2" rx="8"/>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#9333ea" stroke-width="1"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#9333ea" stroke-width="1"/>
    <line x1="-50" y1="20" x2="50" y2="20" stroke="#9333ea" stroke-width="1"/>
  </g>
  
  <!-- Skill badges representation -->
  <g transform="translate(250, 350)" opacity="0.15">
    <circle cx="0" cy="0" r="8" fill="#9333ea"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">JS</text>
  </g>
  
  <g transform="translate(350, 380)" opacity="0.15">
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">PHP</text>
  </g>
  
  <g transform="translate(450, 350)" opacity="0.15">
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">UI</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#9333ea" opacity="0.3"/>
  <circle cx="750" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="550" r="3" fill="#10b981" opacity="0.3"/>
  <circle cx="750" cy="550" r="3" fill="#f59e0b" opacity="0.3"/>
</svg>
